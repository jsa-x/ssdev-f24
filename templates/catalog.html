<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.3/css/bulma.min.css">
    <style>
        /* Custom styles for consistent card sizes */
        .card {
            height: 100%; /* Ensures the card takes full height within the column */
            display: flex;
            flex-direction: column;
            transition: transform 0.3s, box-shadow 0.3s; /* Smooth hover effects */
        }
        .card:hover {
            transform: translateY(-5px); /* Lift effect */
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2); /* Add shadow on hover */
        }
        .card-content {
            flex-grow: 1; /* Allows the content to take up available space */
        }
        .fixed-image-container {
            height: 200px; /* Fixed height for image container */
            overflow: hidden; /* Ensures image doesn't overflow */
        }
        .fixed-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Ensures the image covers the container without distorting */
        }
    </style>
</head>
{% extends "base.html" %}

{% block title %}Product Catalog{% endblock %}

{% block content %}
<section class="section">
    <div class="container">
        <h1 class="title has-text-centered">Product Catalog</h1>
        <div class="columns is-variable is-multiline">
            {% for product in products %}
            <div class="column is-one-quarter">
                <div class="card">
                    <!-- Product Image -->
                    <div class="card-image fixed-image-container">
                        <img 
                            src="{{ product.image_url or url_for('static', filename='images/default_image.png') }}" 
                            alt="Image of {{ product.name }}">
                    </div>

                    <!-- Product Content -->
                    <div class="card-content">
                        <div class="media">
                            <div class="media-content">
                                <p class="title is-4">{{ product.name }}</p>
                                <p class="subtitle is-6">${{ "%.2f" | format(product.price) }}</p>
                            </div>
                        </div>
                        <div class="content">
                            {{ product.description }}
                        </div>
                    </div>

                    <!-- View Details Button -->
                    <footer class="card-footer">
                        <a href="{{ url_for('product_detail', product_id=loop.index0 + 1) }}" class="card-footer-item button is-link">View Details</a>
                    </footer>
                </div>
            </div>                
            {% endfor %}
        </div>
    </div>
</section>
{% endblock %}
</html>
