{% extends "base.html" %}

{% block title %}Edit Profile{% endblock %}

{% block content %}
<section class="section">
    <div class="container">
        <h1 class="title has-text-centered">Edit Your Profile</h1>

        <div class="columns is-centered">
            <div class="column is-half">
                <div class="box">
                    <form action="{{ url_for('edit_profile') }}" method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                        <!-- Username Field -->
                        <div class="field">
                            <label class="label" for="username">Username</label>
                            <div class="control">
                                <input 
                                    class="input" 
                                    type="text" 
                                    id="username" 
                                    name="username" 
                                    value="{{ user.username }}" 
                                    required>
                            </div>
                        </div>

                        <!-- Email Field -->
                        <div class="field">
                            <label class="label" for="email">Email</label>
                            <div class="control">
                                <input 
                                    class="input" 
                                    type="email" 
                                    id="email" 
                                    name="email" 
                                    value="{{ user.email }}" 
                                    required>
                            </div>
                        </div>

                        <!-- Current Password Field -->
                        <div class="field">
                            <label class="label" for="current_password">Current Password</label>
                            <div class="control">
                                <input 
                                    class="input" 
                                    type="password" 
                                    id="current_password" 
                                    name="current_password" 
                                    placeholder="Enter your current password">
                            </div>
                        </div>

                        <!-- New Password Field -->
                        <div class="field">
                            <label class="label" for="new_password">New Password</label>
                            <div class="control">
                                <input 
                                    class="input" 
                                    type="password" 
                                    id="new_password" 
                                    name="new_password" 
                                    placeholder="Enter your new password">
                            </div>
                        </div>

                        <!-- Action Buttons -->
                        <div class="field is-grouped is-grouped-centered">
                            <div class="control">
                                <button class="button is-primary" type="submit">Save Changes</button>
                            </div>
                            <div class="control">
                                <a href="{{ url_for('profile') }}" class="button is-light">Cancel</a>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
