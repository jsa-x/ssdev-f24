{% extends "base.html" %}

{% block title %}Your Profile{% endblock %}

{% block content %}
<section class="section">
    <div class="container">
        <!-- Page Title -->
        <h1 class="title has-text-centered">Your Profile</h1>

        <!-- Profile Details Section -->
        <div class="columns is-centered">
            <div class="column is-half">
                <div class="box has-text-centered">
                    <!-- Profile Picture (Optional) -->
                    <figure class="image is-128x128 is-inline-block">
                        <img class="is-rounded" src="{{ user.profile_picture_url or 'default_profile.png' }}" alt="Profile Picture">
                    </figure>

                    <!-- User Details -->
                    <p class="mt-4"><strong>Username:</strong> {{ user.username }}</p>
                    <p><strong>Email:</strong> {{ user.email }}</p>
                </div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="buttons is-centered">
            <a href="{{ url_for('edit_profile') }}" class="button is-link">
                <span class="icon"><i class="fas fa-edit"></i></span>
                <span>Edit Profile</span>
            </a>
            <a href="{{ url_for('dashboard') }}" class="button is-primary">
                <span class="icon"><i class="fas fa-arrow-left"></i></span>
                <span>Back to Dashboard</span>
            </a>
        </div>
    </div>
</section>
{% endblock %}
